<svg width="400" height="240" viewBox="0 0 400 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <rect width="400" height="240" fill="url(#gradient)"/>
  <defs>
    <linearGradient id="gradient" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A154B"/>
      <stop offset="100%" stop-color="#6B46C1"/>
    </linearGradient>
  </defs>
  
  <!-- Abstract code pattern background -->
  <g opacity="0.1">
    <text x="20" y="40" font-family="monospace" font-size="14" fill="white">&lt;code&gt;</text>
    <text x="340" y="80" font-family="monospace" font-size="14" fill="white">{ }</text>
    <text x="60" y="160" font-family="monospace" font-size="14" fill="white">=&gt;</text>
    <text x="320" y="200" font-family="monospace" font-size="14" fill="white">&lt;/&gt;</text>
  </g>
  
  <!-- Main icon - Code editor with play button -->
  <g transform="translate(120, 60)">
    <!-- Editor window -->
    <rect x="0" y="0" width="160" height="120" rx="8" fill="white" opacity="0.95"/>
    
    <!-- Window dots -->
    <circle cx="15" cy="15" r="4" fill="#EC6A5E"/>
    <circle cx="30" cy="15" r="4" fill="#F5BF4F"/>
    <circle cx="45" cy="15" r="4" fill="#61C554"/>
    
    <!-- Code lines -->
    <rect x="15" y="35" width="80" height="4" rx="2" fill="#4A154B" opacity="0.3"/>
    <rect x="15" y="45" width="100" height="4" rx="2" fill="#4A154B" opacity="0.3"/>
    <rect x="15" y="55" width="60" height="4" rx="2" fill="#4A154B" opacity="0.3"/>
    <rect x="15" y="70" width="90" height="4" rx="2" fill="#6B46C1" opacity="0.5"/>
    <rect x="15" y="80" width="70" height="4" rx="2" fill="#4A154B" opacity="0.3"/>
    <rect x="15" y="90" width="85" height="4" rx="2" fill="#4A154B" opacity="0.3"/>
    
    <!-- Play/Learn button overlay -->
    <circle cx="125" cy="90" r="20" fill="#F59E0B" opacity="0.95"/>
    <path d="M120 82 L120 98 L133 90 Z" fill="white"/>
  </g>
  
  <!-- Level up arrow -->
  <g transform="translate(340, 30)" opacity="0.8">
    <path d="M0 30 L0 0 L10 10 L0 0 L-10 10 L0 0" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="0" cy="35" r="3" fill="white"/>
  </g>
  
  <!-- Achievement star -->
  <g transform="translate(50, 30)" opacity="0.7">
    <path d="M0,-10 L2.5,-3 L10,-3 L4,2 L6,9 L0,5 L-6,9 L-4,2 L-10,-3 L-2.5,-3 Z" fill="#F59E0B"/>
  </g>
</svg>
